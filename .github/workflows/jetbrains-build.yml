name: JetBrains Plugin Build

on:
  push:
    branches: [main]
    paths:
      - "apps/jetbrains-plugin/**"
      - ".github/workflows/jetbrains-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/jetbrains-plugin/**"
      - ".github/workflows/jetbrains-build.yml"

concurrency:
  group: jetbrains-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build JetBrains plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: |
          cd apps/jetbrains-plugin
          ./gradlew buildPlugin --no-daemon

      - name: Verify plugin
        run: |
          cd apps/jetbrains-plugin
          ./gradlew verifyPlugin --no-daemon

      - name: Run tests
        run: |
          cd apps/jetbrains-plugin
          ./gradlew test --no-daemon

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: jetbrains-plugin
          path: apps/jetbrains-plugin/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14
