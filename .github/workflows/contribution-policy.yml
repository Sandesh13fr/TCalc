name: Contribution policy

on:
  pull_request_target:
    branches: [main, Development]
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  enforce:
    name: Assigned issue and one open PR
    runs-on: ubuntu-latest
    steps:
      - name: Enforce contribution policy
        uses: actions/github-script@v7
        with:
          script: |
            const trusted = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const isExempt = (pull) => pull.draft || trusted.has(pull.author_association) || pull.user.type === 'Bot';
            const parseIssueNumbers = (body) => [...body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi)]
              .map((match) => Number(match[1]));
            const evaluate = ({ issueNumbers, assigned, otherPull }) => [
              ...(issueNumbers.length === 0 ? ['Link an open issue with `Fixes #123`, `Closes #123`, or `Resolves #123`.'] : []),
              ...(issueNumbers.length > 0 && !assigned ? ['The linked open issue must be assigned to the PR author before the PR is opened.'] : []),
              ...(otherPull ? [`Only one open PR is allowed per external contributor; #${otherPull.number} is already open.`] : []),
            ];
            const assert = require('node:assert/strict');
            assert.deepEqual(parseIssueNumbers('Fixes #123\ncloses #9'), [123, 9]);
            assert.deepEqual(parseIssueNumbers('Related to #7'), []);
            assert.deepEqual(evaluate({ issueNumbers: [1], assigned: true }), []);
            assert.equal(evaluate({ issueNumbers: [1], assigned: false })[0].includes('assigned'), true);
            assert.equal(evaluate({ issueNumbers: [1], assigned: true, otherPull: { number: 2 } })[0].includes('#2'), true);
            assert.equal(isExempt({ draft: false, author_association: 'MEMBER', user: { type: 'User' } }), true);
            assert.equal(isExempt({ draft: false, author_association: 'NONE', user: { type: 'Bot' } }), true);

            const pull = context.payload.pull_request;
            if (isExempt(pull)) return;

            const issueNumbers = parseIssueNumbers(pull.body ?? '');
            const { owner, repo } = context.repo;
            const author = pull.user.login.toLowerCase();
            let assigned = false;
            if (issueNumbers.length > 0) {
              for (const issue_number of [...new Set(issueNumbers)]) {
                try {
                  const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
                  assigned ||= issue.state === 'open' && !issue.pull_request &&
                    issue.assignees.some((assignee) => assignee.login.toLowerCase() === author);
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const otherPull = openPulls.find((candidate) =>
              candidate.number !== pull.number && candidate.user.login.toLowerCase() === author);
            const violations = evaluate({ issueNumbers, assigned, otherPull });

            if (violations.length === 0) return;

            const marker = '<!-- contribution-policy -->';
            const body = `${marker}\nThis PR was closed by the contribution policy:\n\n${violations.map((item) => `- ${item}`).join('\n')}\n\nPlease resolve the items above, then reopen the PR.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pull.number, per_page: 100,
            });
            const previous = comments.find((comment) => comment.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pull.number, body });
            }
            await github.rest.pulls.update({ owner, repo, pull_number: pull.number, state: 'closed' });
            core.setFailed(violations.join(' '));
