name: Publish to Open VSX

run-name: >-
  Open VSX ${{ fromJSON(inputs.dry_run) && 'dry run' || 'publish' }}
  ${{ inputs.version != '' && format('({0})', inputs.version) || '' }}

# Manual trigger only. Never auto-publishes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Extension version/tag to publish (informational; package.json version is authoritative)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Package and validate only; do not publish to Open VSX"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-open-vsx-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-test-package:
    name: Build, test, package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check extension metadata
        run: pnpm check:extension-metadata

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Package VSIX
        run: pnpm package:vscode

      - name: Inspect VSIX
        run: pnpm package:vscode:inspect

      - name: Log workflow inputs
        shell: bash
        run: |
          echo "inputs.version: ${{ inputs.version }}"
          echo "inputs.dry_run: ${{ inputs.dry_run }}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-vsx-vsix
          path: dist-vsix/*.vsix
          if-no-files-found: error
          retention-days: 30

  publish-open-vsx:
    name: Publish to Open VSX
    needs: build-test-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # fromJSON converts the string "true"/"false" to a boolean
    if: ${{ !fromJSON(inputs.dry_run) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify OPEN_VSX_TOKEN is configured
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPEN_VSX_TOKEN:-}" ]; then
            echo "::error::OPEN_VSX_TOKEN secret is not configured for this repository."
            echo "::error::Add it at: Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "::error::Name: OPEN_VSX_TOKEN"
            echo "::error::Value: your Open VSX access token"
            exit 1
          fi
          if [ "${#OPEN_VSX_TOKEN}" -lt 16 ]; then
            echo "::error::OPEN_VSX_TOKEN looks too short. Refusing to publish."
            exit 1
          fi
          echo "OPEN_VSX_TOKEN is present."

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: open-vsx-vsix
          path: dist-vsix

      - name: List downloaded VSIX
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist-vsix
          VSIX_COUNT=$(find dist-vsix -maxdepth 1 -name "*.vsix" | wc -l | tr -d " ")
          if [ "$VSIX_COUNT" != "1" ]; then
            echo "::error::Expected exactly one VSIX file, found $VSIX_COUNT."
            exit 1
          fi

      - name: Verify Open VSX PAT can publish to namespace
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHER=$(node -e 'console.log(require("./apps/vscode-extension/package.json").publisher)')
          echo "Publisher namespace: $PUBLISHER"
          if ! npx -y ovsx verify-pat "$PUBLISHER" --pat "$OPEN_VSX_TOKEN"; then
            echo "::error::Token cannot publish to Open VSX namespace '$PUBLISHER'."
            echo "::error::Make sure:"
            echo "::error::  1. The namespace '$PUBLISHER' exists on Open VSX."
            echo "::error::  2. The token owner has access to that namespace."
            echo "::error::  3. The token has permission to publish extensions."
            echo "::error::If needed, create the namespace locally with:"
            echo "::error::  npx ovsx create-namespace $PUBLISHER --pat <token>"
            exit 1
          fi
          echo "PAT verified for namespace '$PUBLISHER'."

      - name: Publish to Open VSX
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VSIX_FILE=$(find dist-vsix -maxdepth 1 -name "*.vsix" | head -n 1)
          echo "Publishing VSIX: $VSIX_FILE"
          npx -y ovsx publish "$VSIX_FILE" --pat "$OPEN_VSX_TOKEN"

  publish-dry-run-summary:
    name: Dry-run summary
    needs: build-test-package
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # fromJSON converts the string "true"/"false" to a boolean
    if: ${{ always() && fromJSON(inputs.dry_run) }}
    steps:
      - name: Dry run notice
        shell: bash
        run: |
          echo "dry_run=true; no publish performed."
          echo "The extension was built, tested, packaged, inspected, and uploaded as an artifact."
          echo "To publish for real, re-run this workflow with dry_run=false."
          echo "Required repository secret: OPEN_VSX_TOKEN"
